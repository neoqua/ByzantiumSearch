use_default_settings: true

server:
  secret_key: "change-me-to-a-random-string"
  bind_address: "0.0.0.0"
  port: 8080

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: go
    inactive: false
    disabled: false

  - name: google cse
    disabled: true

  - name: google news
    inactive: true

  - name: duckduckgo
    disabled: true

  - name: duckduckgo images
    disabled: true

  - name: yandex
    disabled: true

  - name: brave
    disabled: true

  - name: startpage
    disabled: true

  - name: bing
    disabled: true

  - name: yahoo
    disabled: true

outgoing:
  request_timeout: 15.0
  max_request_timeout: 25.0
  useragent_suffix: ""
