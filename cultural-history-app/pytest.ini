[pytest]
testpaths = tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
# anyio ships its own pytest plugin (pulled in via httpx/starlette); we use
# pytest-asyncio only, and the extra plugin is a suspected cause of the
# Windows collection hang, so keep it out.
addopts = -p no:anyio
# If a run stalls (seen on Windows/Python 3.13 during collection), dump the
# stack of every thread after this many seconds instead of hanging silently.
faulthandler_timeout = 60
