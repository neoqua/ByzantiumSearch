{% extends "base.html" %}
{% block title %}Анализ культурно-исторических объектов{% endblock %}
{% block content %}
<h1>Анализ упоминаний культурно-исторических объектов</h1>

<form id="search-form">
    <label for="object_name">Название объекта *</label>
    <input type="text" id="object_name" name="object_name" required placeholder="Свято-Климентовский монастырь">

    <label for="keywords">Ключевые слова * (через запятую)</label>
    <input type="text" id="keywords" name="keywords" required placeholder="Византия, Константинополь, Царьград">

    <label for="annual_visitors">Годовая посещаемость</label>
    <input type="number" id="annual_visitors" name="annual_visitors" placeholder="10000">

    <label for="manual_urls">Ссылки для обязательной проверки (по одной на строку)</label>
    <textarea id="manual_urls" name="manual_urls" placeholder="https://example.com/post1"></textarea>

    <details id="llm-settings">
        <summary>Настройки подключения LLM</summary>
        <label>Провайдер
            <select id="llm-provider">
                <option value="local">Локальный (LM Studio)</option>
                <option value="yandex">YandexGPT (Yandex Cloud)</option>
                <option value="openai">OpenAI-совместимый API</option>
            </select>
        </label>

        <div id="fields-local">
            <label>Эндпоинт (пусто = по умолчанию из настроек сервера)</label>
            <input type="text" id="llm-local-endpoint" placeholder="http://localhost:1234">
            <label>Модель</label>
            <input type="text" id="llm-local-model" placeholder="meta-llama-3.1-8b-instruct">
        </div>

        <div id="fields-yandex" style="display:none;">
            <label>API-ключ</label>
            <input type="password" id="llm-yandex-api-key">
            <label>Эндпоинт</label>
            <input type="text" id="llm-yandex-endpoint" value="https://ai.api.cloud.yandex.net/v1">
            <label>Folder ID</label>
            <input type="text" id="llm-yandex-folder-id">
            <label>Модель</label>
            <select id="llm-yandex-model">
                <option value="qwen3-235b-a22b-fp8" selected>Qwen3 235B (256k)</option>
                <option value="gpt-oss-120b">gpt-oss-120b (128k)</option>
                <option value="gpt-oss-20b">gpt-oss-20b (128k)</option>
                <option value="aliceai-llm">Alice AI LLM (128k)</option>
                <option value="aliceai-llm-flash">Alice AI LLM Flash (64k)</option>
                <option value="yandexgpt-5-lite">YandexGPT Lite 5 (32k)</option>
                <option value="yandexgpt-5.1">YandexGPT Pro 5.1 (32k)</option>
                <option value="yandexgpt-5-pro">YandexGPT Pro 5 (32k)</option>
                <option value="deepseek-v4-flash">DeepSeek V4 Flash (1M)</option>
                <option value="qwen3.6-35b-a3b">Qwen3.6 35B (256k)</option>
            </select>
        </div>

        <div id="fields-openai" style="display:none;">
            <label>API-ключ</label>
            <input type="password" id="llm-openai-api-key">
            <label>Эндпоинт</label>
            <input type="text" id="llm-openai-endpoint" placeholder="https://api.openai.com/v1">
            <label>Модель</label>
            <input type="text" id="llm-openai-model">
        </div>

        <button type="button" id="llm-test-btn">Проверить подключение</button>
        <span id="llm-test-result"></span>
    </details>

    <label>Поисковый движок
        <select id="search-engine">
            <option value="searxng">SearXNG</option>
            <option value="openserp">OpenSERP</option>
        </select>
    </label>

    <button type="submit">Запустить анализ</button>
</form>

<div id="progress" style="display:none;">
    <h2>Анализ выполняется...</h2>
    <div id="progress-status"></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div id="progress-text"></div>
    <button type="button" id="stop-btn" style="display:none;">Остановить анализ</button>
</div>

<script>
const LLM_STORAGE_KEY = 'llm_settings';

const SEARCH_ENGINE_STORAGE_KEY = 'search_engine';

function searchEngineLoad() {
    const saved = localStorage.getItem(SEARCH_ENGINE_STORAGE_KEY);
    if (saved === 'openserp' || saved === 'searxng') {
        document.getElementById('search-engine').value = saved;
    }
}

function searchEngineSave() {
    localStorage.setItem(SEARCH_ENGINE_STORAGE_KEY, document.getElementById('search-engine').value);
}

function llmNormalizeLocalEndpoint(value) {
    const v = (value || '').trim().replace(/\/+$/, '');
    return (v === '' || v === 'http://localhost:1234' || v === 'http://127.0.0.1:1234') ? '' : v;
}

function llmShowFields(provider) {
    document.getElementById('fields-local').style.display = provider === 'local' ? 'block' : 'none';
    document.getElementById('fields-yandex').style.display = provider === 'yandex' ? 'block' : 'none';
    document.getElementById('fields-openai').style.display = provider === 'openai' ? 'block' : 'none';
}

function llmLoadSettings() {
    const saved = JSON.parse(localStorage.getItem(LLM_STORAGE_KEY) || 'null');
    if (!saved) { llmShowFields('local'); return; }
    document.getElementById('llm-provider').value = saved.provider || 'local';
    if (saved.local) {
        document.getElementById('llm-local-endpoint').value = llmNormalizeLocalEndpoint(saved.local.endpoint || '');
        document.getElementById('llm-local-model').value = saved.local.model || '';
    }
    if (saved.yandex) {
        document.getElementById('llm-yandex-api-key').value = saved.yandex.api_key || '';
        document.getElementById('llm-yandex-endpoint').value = saved.yandex.endpoint || 'https://ai.api.cloud.yandex.net/v1';
        document.getElementById('llm-yandex-folder-id').value = saved.yandex.folder_id || '';
        document.getElementById('llm-yandex-model').value = saved.yandex.model || 'qwen3-235b-a22b-fp8';
    }
    if (saved.openai) {
        document.getElementById('llm-openai-api-key').value = saved.openai.api_key || '';
        document.getElementById('llm-openai-endpoint').value = saved.openai.endpoint || '';
        document.getElementById('llm-openai-model').value = saved.openai.model || '';
    }
    llmShowFields(saved.provider || 'local');
}

function llmCollectSettings() {
    const provider = document.getElementById('llm-provider').value;
    const local = {
        endpoint: llmNormalizeLocalEndpoint(document.getElementById('llm-local-endpoint').value),
        model: document.getElementById('llm-local-model').value,
    };
    const yandex = {
        api_key: document.getElementById('llm-yandex-api-key').value,
        endpoint: document.getElementById('llm-yandex-endpoint').value,
        folder_id: document.getElementById('llm-yandex-folder-id').value,
        model: document.getElementById('llm-yandex-model').value,
    };
    const openai = {
        api_key: document.getElementById('llm-openai-api-key').value,
        endpoint: document.getElementById('llm-openai-endpoint').value,
        model: document.getElementById('llm-openai-model').value,
    };
    const stored = { provider: provider, local: local, yandex: yandex, openai: openai };
    localStorage.setItem(LLM_STORAGE_KEY, JSON.stringify(stored));
    const active = provider === 'local' ? local : provider === 'yandex' ? yandex : openai;
    return Object.assign({ provider: provider }, active);
}

function safeUrl(value) {
    if (!value) return null;
    try {
        const u = new URL(value, window.location.origin);
        return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
    } catch (e) {
        return null;
    }
}

document.getElementById('search-form').onsubmit = async function(e) {
    e.preventDefault();
    const form = e.target;
    const data = {
        object_name: form.object_name.value,
        keywords: form.keywords.value,
        annual_visitors: form.annual_visitors.value ? parseInt(form.annual_visitors.value) : null,
        manual_urls: form.manual_urls.value || null,
        llm_settings: llmCollectSettings(),
        search_engine: document.getElementById('search-engine').value,
    };

    const resp = await fetch('/api/search', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
    });
    const result = await resp.json();

    document.getElementById('search-form').style.display = 'none';
    document.getElementById('progress').style.display = 'block';

    const evtSource = new EventSource(`/api/tasks/${result.task_id}/progress`);
    const stopBtn = document.getElementById('stop-btn');
    stopBtn.style.display = 'inline-block';
    stopBtn.onclick = async function() {
        stopBtn.disabled = true;
        stopBtn.textContent = 'Остановка...';
        await fetch(`/api/tasks/${result.task_id}/stop`, {method: 'POST'});
    };
    evtSource.addEventListener('progress', function(event) {
        const data = JSON.parse(event.data);
        const pct = data.total > 0 ? Math.round(data.processed / data.total * 100) : 0;
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('progress-status').innerHTML =
            `Обработано: ${data.processed} из ${data.total} | Найдено с ключевым словом: ${data.found_keyword}`;
        const progressTextEl = document.getElementById('progress-text');
        progressTextEl.textContent = '';
        if (data.current_url) {
            progressTextEl.textContent = 'Текущий: ';
            const linkUrl = safeUrl(data.current_url);
            if (linkUrl) {
                const link = document.createElement('a');
                link.href = linkUrl;
                link.target = '_blank';
                link.textContent = data.current_title || data.current_url;
                progressTextEl.appendChild(link);
            }
        }
    });
    evtSource.addEventListener('done', function(event) {
        evtSource.close();
        stopBtn.style.display = 'none';
        window.location.href = JSON.parse(event.data).redirect;
    });
    evtSource.addEventListener('error', function(event) {
        evtSource.close();
        document.getElementById('progress-text').innerHTML = '<div class="error">Ошибка при выполнении анализа</div>';
    });
};

document.getElementById('llm-provider').addEventListener('change', function() {
    llmShowFields(this.value);
});
document.getElementById('llm-test-btn').addEventListener('click', async function() {
    const btn = this;
    const resultEl = document.getElementById('llm-test-result');
    resultEl.textContent = 'Проверка...';
    btn.disabled = true;
    try {
        const resp = await fetch('/api/llm/test', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(llmCollectSettings()),
        });
        const body = await resp.json();
        if (body.ok) {
            resultEl.textContent = 'Подключение работает';
            resultEl.style.color = 'green';
        } else {
            resultEl.textContent = body.error || 'Ошибка подключения';
            resultEl.style.color = 'red';
        }
    } catch (e) {
        resultEl.textContent = 'Ошибка запроса';
        resultEl.style.color = 'red';
    } finally {
        btn.disabled = false;
    }
});
llmLoadSettings();
document.getElementById('search-engine').addEventListener('change', searchEngineSave);
searchEngineLoad();
</script>
{% endblock %}
